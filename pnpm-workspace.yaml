allowBuilds:
  bufferutil: true
  esbuild: true
  # the mongod binary is downloaded on first use and cached, not at install
  mongodb-memory-server: false
  unrs-resolver: true
  utf-8-validate: false
dedupePeerDependents: true
minimumReleaseAge: 3600
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
  - nightingale-levels
  - nightingale-types
  - extended-json
  - liwi-*
  - react-liwi
nodeLinker: hoisted
overrides:
  # the native linux-x64 binary of rollup 4.67 crashes with SIGILL on the
  # production server cpu (Xeon E3-1245 V2, x86-64-v2, no AVX2)
  rollup: npm:@rollup/wasm-node@4.67.3
packages:
  - packages/*
savePrefix: ""
