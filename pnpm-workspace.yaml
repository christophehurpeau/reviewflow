allowBuilds:
  # optional native speedups of ws, the js fallbacks are enough here
  bufferutil: false
  esbuild: true
  unrs-resolver: true
  utf-8-validate: false
dedupePeerDependents: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - extended-json
  - liwi-*
  - nightingale
  - nightingale-logger
  - react-liwi
nodeLinker: hoisted
packages:
  - packages/*
savePrefix: ""
