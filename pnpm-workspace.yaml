allowBuilds:
  bufferutil: false
  esbuild: true
  mongodb-memory-server: false
  unrs-resolver: true
  utf-8-validate: false
dedupePeerDependents: true
minimumReleaseAge: 3600
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
nodeLinker: hoisted
packages:
  - packages/*
savePrefix: ""
