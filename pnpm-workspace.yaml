allowBuilds:
  bufferutil: true
  esbuild: true
  mongodb-memory-server: false
  unrs-resolver: true
  utf-8-validate: false
dedupePeerDependents: true
minimumReleaseAge: 3600
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
  - nightingale-levels
  - nightingale-types
  - extended-json
  - liwi-*
  - react-liwi
nodeLinker: hoisted
overrides:
  rollup: npm:@rollup/wasm-node@4.68.3
packages:
  - packages/*
savePrefix: ""
