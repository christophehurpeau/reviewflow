allowBuilds:
  bufferutil: true
  esbuild: true
  # the mongod binary is downloaded on first use and cached, not at install
  mongodb-memory-server: false
  unrs-resolver: true
  utf-8-validate: false
dedupePeerDependents: true
minimumReleaseAge: 3600
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
  - nightingale-levels
  - nightingale-types
  - extended-json
  - liwi-*
  - react-liwi
nodeLinker: hoisted
packages:
  - packages/*
savePrefix: ""
