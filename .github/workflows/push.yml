name: Push CI
permissions:
  contents: read
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        if: startsWith(matrix.node-version, '24.')

      - name: Format
        run: pnpm run format:check
        if: startsWith(matrix.node-version, '24.')

      - name: Typescript
        run: pnpm run tsc
        if: startsWith(matrix.node-version, '24.')

      - name: Eslint
        run: pnpm run lint:eslint
        if: startsWith(matrix.node-version, '24.')

      - name: Check nothing was forgotten before commit
        if: startsWith(matrix.node-version, '24.')
        run: pnpm exec repository-check-dirty

      # the webapp storybook project renders its stories in a real browser
      - name: Install Playwright chromium
        run: pnpm --filter webapp exec playwright install --with-deps chromium

      # tests start a real mongod through mongodb-memory-server, which downloads
      # the binary on first use (version pinned in scripts/vitestMongoGlobalSetup.ts)
      - name: Cache mongod binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('scripts/vitestMongoGlobalSetup.ts') }}

      - name: Test
        run: pnpm run test
        env:
          CI: true
