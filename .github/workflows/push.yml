# Generated by pob: do not edit, it is overwritten on each pob run.
name: Push CI
permissions:
  contents: read
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check nothing was forgotten before commit
        run: pnpm exec repository-check-dirty

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Format
        run: pnpm run format:check

      - name: Typescript
        run: pnpm run tsc

      - name: Oxlint
        run: pnpm run lint:oxlint

      - name: Eslint
        run: pnpm run lint:eslint

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Playwright chromium
        run: pnpm --dir 'packages/webapp' exec playwright install --with-deps chromium

      - name: Cache mongod binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('scripts/vitestMongoGlobalSetup.ts') }}

      - name: Test
        run: pnpm run test
